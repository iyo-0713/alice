name: Pytest

on:
  push:
    paths:
      - "services/backend/**"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: services/backend

      - name: Run pytest
        run: pytest
        working-directory: services/backend
