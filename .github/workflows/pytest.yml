name: Pytest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "services/backend/**"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >
            pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{
              hashFiles('services/backend/pyproject.toml',
                        'services/backend/setup.cfg',
                        'services/backend/requirements*.txt')
            }}
          restore-keys: |
            pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: services/backend

      - name: Run pytest
        run: pytest
        working-directory: services/backend
