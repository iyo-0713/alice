name: RedPen Document Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  redpen:
    name: redpen-check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # リポジトリのコードをチェックアウト
      - uses: actions/checkout@v4

      # RedPen + reviewdog を実行
      - name: Run RedPen via reviewdog
        uses: tsuyoshicho/action-redpen@v1
        with:
          reporter: github-pr-check
          basedir: "."
          targets: |
            README.md
            services/backend/README.md
            services/frontend/README.md
            services/postgres/README.md
          config: "config/redpen-conf-ja.xml"
          # fail_level: error
          fail_level: warning
