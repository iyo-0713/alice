[project]
name = "alice-backend"
version = "0.1.0"
description = "Backend service for alice"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py313"
lint.ignore = ["PGH004", "S101", "D104", "D101", "D102", "D203", "D213", "FAST002", "RET504"]
lint.select = ["ALL"]
